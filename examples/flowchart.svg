<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
  <rect id="background" fill="#f7f9fc" x="0" y="0" width="800" height="360"/>
  <text id="heading" fill="#66758c" x="56" y="58">LAB 01 / A SMALL FLOW</text>
  <text id="caption" fill="#66758c" x="56" y="312">Create. Compose. Move together. Undo with confidence.</text>
  <g id="flowchart">
    <g id="node1">
      <rect id="start" fill="#133f4b" x="100" y="132" width="200" height="88"/>
      <text id="start-label" fill="#ffffff" x="164" y="181">开始 / Start</text>
    </g>
    <g id="node2">
      <rect id="process" fill="#dceee8" x="500" y="132" width="200" height="88"/>
      <text id="process-label" fill="#133f4b" x="542" y="181">处理 / Process</text>
    </g>
    <line id="connector" stroke="#5b8c7c" stroke-width="2" x1="300" y1="176" x2="500" y2="176"/>
    <line id="arrow-top" stroke="#5b8c7c" stroke-width="2" x1="490" y1="168" x2="500" y2="176"/>
    <line id="arrow-bottom" stroke="#5b8c7c" stroke-width="2" x1="490" y1="184" x2="500" y2="176"/>
  </g>
</svg>
